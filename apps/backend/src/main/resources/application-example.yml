# application.yml 配置示例

# 大模型 API 配置
llm:
  api:
    # 阿里云百炼平台（兼容 OpenAI API）
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    # API Key（建议通过环境变量注入）
    key: ${DASHSCOPE_API_KEY:sk-your-api-key-here}

# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /

# 日志配置
logging:
  level:
    com.kuakua: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# HTTP 客户端配置
spring:
  http:
    client:
      timeout:
        connect: 30s
        read: 60s

# Jackson 配置（JSON 序列化）
spring:
  jackson:
    default-property-inclusion: non_null
    serialization:
      indent_output: true

server:
  port: ${PORT:8080}

spring:
  application:
    name: kuakua-mirror

  # 数据源配置
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:kuakua_mirror}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}

  # JPA 配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
        format_sql: true

  # H2 Console (开发用)
  h2:
    console:
      enabled: true
      path: /h2-console

  # WebFlux 配置
  webflux:
    base-path: /api

# 日志配置
logging:
  level:
    root: INFO
    com.kuakua.mirror: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 阿里云百炼配置
dashscope:
  api-key: ${DASHSCOPE_API_KEY:}
  base-url: ${DASHSCOPE_BASE_URL:}
  websocket-url: ${DASHSCOPE_WEBSOCKET_URL:}
  model:
    vision: ${DASHSCOPE_VISION_MODEL:qwen3-vl-plus}
    text: ${DASHSCOPE_TEXT_MODEL:qwen-plus}
    asr: ${DASHSCOPE_ASR_MODEL:qwen-audio-3.0-asr-flash-streaming}
    tts: ${DASHSCOPE_TTS_MODEL:qwen-audio-3.0-tts-flash}
  tts-voice: ${DASHSCOPE_TTS_VOICE:}

k10:
  audio-directory: ${K10_AUDIO_DIRECTORY:${java.io.tmpdir}/kuakua-mirror-audio}
  audio-ttl-minutes: ${K10_AUDIO_TTL_MINUTES:10}

supabase:
  url: ${SUPABASE_URL:}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  image-bucket: ${SUPABASE_IMAGE_BUCKET:device-images}
  firmware-bucket: ${SUPABASE_FIRMWARE_BUCKET:device-firmware}

factory:
  provisioning-csv: ${FACTORY_PROVISIONING_CSV:}

firmware:
  signing-private-key: ${FIRMWARE_SIGNING_PRIVATE_KEY:}
  publish:
    file: ${FIRMWARE_PUBLISH_FILE:}
    model: ${FIRMWARE_PUBLISH_MODEL:}
    version: ${FIRMWARE_PUBLISH_VERSION:}
    notes: ${FIRMWARE_PUBLISH_NOTES:}

# 音频配置
audio:
  format: pcm16
  sample-rate: 24000
  channels: 1

# WebSocket 配置
websocket:
  allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:*}

# JWT 配置
jwt:
  secret: ${JWT_SECRET:default_secret_key_change_in_production_at_least_32_characters}
  expiration: ${JWT_EXPIRATION:604800000}

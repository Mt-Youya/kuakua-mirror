version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kuakua-mirror-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - DASHSCOPE_TTS_VOICE=${DASHSCOPE_TTS_VOICE}
      - K10_AUDIO_DIRECTORY=/app/audio
    volumes:
      - ./logs:/app/logs
      - ./audio:/app/audio
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    networks:
      - kuakua-network

networks:
  kuakua-network:
    driver: bridge

volumes:
  logs:

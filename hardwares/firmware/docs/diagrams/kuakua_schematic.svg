  <text x="120" y="688" font-size="12.5" font-family="Consolas,'JetBrains Mono',monospace" fill="#6B7075">D0=8 D1=10 D2=11 D3=9 D4=18 D5=16 D6=15 D7=6</text>
  <text x="120" y="708" font-size="12.5" font-family="Consolas,'JetBrains Mono',monospace" fill="#6B7075">XCLK=7 PCLK=17 VSYNC=4 HREF=5</text>

  <!-- ==================== SW1 / SW2 (left) ==================== -->

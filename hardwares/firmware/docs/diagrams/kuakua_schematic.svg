  <g font-size="12.5" font-family="Consolas,'JetBrains Mono',monospace" fill="#1A1D21">
    <text x="782" y="334">GPIO7 · XCLK</text>
    <text x="782" y="374">GPIO17 · PCLK</text>
    <text x="782" y="414">GPIO4 · VSYNC</text>
    <text x="782" y="454">GPIO5 · HREF</text>
    <text x="782" y="509">GPIO8/10/11/9/18/16/15/6 · D[7:0]</text>
    <text x="782" y="589">GPIO47 · I2C0_SDA</text>
    <text x="782" y="629">GPIO48 · I2C0_SCL</text>
    <text x="782" y="714">BTN_A（板载 IO 扩展）</text>
    <text x="782" y="764">BTN_B（板载 IO 扩展）</text>
    <text x="782" y="849">GPIO19 · USB_D-</text>
    <text x="782" y="894">GPIO20 · USB_D+</text>
  </g>


  <line x1="596" y1="516" x2="618" y2="494" stroke="#1A1D21" stroke-width="2"/>
  <text x="622" y="497" font-size="13" font-family="Consolas,'JetBrains Mono',monospace" fill="#1A1D21">8</text>

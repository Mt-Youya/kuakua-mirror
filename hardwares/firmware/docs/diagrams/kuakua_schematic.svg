    <text x="1218" y="834">GPIO46 · LED_DATA</text>
  </g>

  <!-- ==================== CAM1 (left) ==================== -->
  <rect x="120" y="280" width="350" height="380" fill="#FFFFFF" stroke="#1A1D21" stroke-width="2" rx="6"/>
  <text x="140" y="316" font-size="17" font-weight="700" fill="#1A1D21">CAM1 · 摄像头模组（200 万像素）</text>
  <text x="140" y="340" font-size="13" fill="#6B7075">DVP 8bit 并口 · RGB565 QVGA · XCLK 10MHz</text>
  <text x="140" y="362" font-size="13" fill="#6B7075">帧缓冲位于 PSRAM · JPEG 质量 12</text>
  <g font-size="12.5" font-family="Consolas,'JetBrains Mono',monospace" fill="#1A1D21" text-anchor="end">
    <text x="452" y="334">XCLK</text>
    <text x="452" y="374">PCLK</text>
    <text x="452" y="414">VSYNC</text>
    <text x="452" y="454">HREF</text>
    <text x="452" y="509">D[7:0]</text>
    <text x="452" y="589">SIOD</text>
    <text x="452" y="629">SIOC</text>
  </g>
  <text x="140" y="412" font-size="13" fill="#6B7075">SCCB 控制总线复用 I2C0</text>


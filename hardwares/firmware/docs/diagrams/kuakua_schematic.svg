  <text x="1540" y="566" font-size="17" font-weight="700" fill="#1A1D21">U3 · 板载音频编解码（I2S0 主机）</text>
  <text x="1540" y="590" font-size="13" fill="#6B7075">16bit · 全双工 · 录音 16kHz / 播放 TTS WAV</text>

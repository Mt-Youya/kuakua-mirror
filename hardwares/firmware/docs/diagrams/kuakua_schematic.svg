  <!-- sheet -->
  <rect width="2000" height="1300" fill="#FFFFFF"/>
  <rect x="24" y="24" width="1952" height="1252" fill="none" stroke="#1A1D21" stroke-width="2.5"/>

  <!-- sheet title -->
  <text x="60" y="78" font-size="30" font-weight="700" fill="#1A1D21">夸夸镜 KuaKua Mirror —— 硬件系统原理图（系统级连接）</text>
  <text x="60" y="108" font-size="15" fill="#6B7075">平台：DFRobot 行空板 K10（UNIHIKER K10 · ESP32-S3）· 依据固件 v1.0.0 源码实测绘制 · 网络标号 = GPIO 号</text>

  <!-- ==================== U1 ESP32-S3 ==================== -->
  <rect x="770" y="170" width="460" height="770" fill="#FFFFFF" stroke="#1A1D21" stroke-width="2.2" rx="8"/>
  <text x="1000" y="226" text-anchor="middle" font-size="22" font-weight="700" fill="#1A1D21">U1 · ESP32-S3-WROOM-1（N16R8）</text>
  <text x="1000" y="254" text-anchor="middle" font-size="14" fill="#6B7075">双核 Xtensa LX7 @240MHz · Wi-Fi 802.11 b/g/n · BLE 5</text>
  <text x="1000" y="278" text-anchor="middle" font-size="14" fill="#6B7075">16MB Flash · 8MB OPI PSRAM（帧缓冲 / 媒资缓存）</text>

  <!-- left stubs -->
  <g stroke="#1A1D21" stroke-width="1.7">
    <line x1="740" y1="330" x2="770" y2="330"/>
    <line x1="740" y1="370" x2="770" y2="370"/>
    <line x1="740" y1="410" x2="770" y2="410"/>
    <line x1="740" y1="450" x2="770" y2="450"/>
    <line x1="740" y1="505" x2="770" y2="505"/>
    <line x1="740" y1="585" x2="770" y2="585"/>
    <line x1="740" y1="625" x2="770" y2="625"/>
    <line x1="740" y1="710" x2="770" y2="710"/>
    <line x1="740" y1="760" x2="770" y2="760"/>
    <line x1="740" y1="845" x2="770" y2="845"/>
    <line x1="740" y1="890" x2="770" y2="890"/>
  </g>

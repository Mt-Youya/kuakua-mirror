  <text x="138" y="749" font-size="15" font-weight="700" fill="#1A1D21">SW1 · 按键 A</text>
  <text x="138" y="770" font-size="12.5" fill="#6B7075">板载 P5 · 短按拍照 / 长按对话</text>
  <path d="M 330 753 h 30 l 24 -12" stroke="#1A1D21" stroke-width="1.8" fill="none"/>
  <circle cx="360" cy="753" r="3" fill="#1A1D21"/>
  <circle cx="396" cy="753" r="3" fill="none" stroke="#1A1D21" stroke-width="1.8"/>
  <path d="M 396 753 h 324 v -43 h 20" stroke="#1A1D21" stroke-width="1.7" fill="none"/>
  <text x="560" y="742" text-anchor="middle" font-size="12.5" font-family="Consolas,'JetBrains Mono',monospace" fill="#1A1D21">BTN_A</text>
  <use href="#gnd" x="225" y="782"/>

  <rect x="120" y="830" width="210" height="58" fill="#FFFFFF" stroke="#1A1D21" stroke-width="2" rx="6"/>
  <text x="138" y="855" font-size="15" font-weight="700" fill="#1A1D21">SW2 · 按键 B</text>
  <text x="138" y="876" font-size="12.5" fill="#6B7075">板载 P11 · 短按抱抱 / 长按重连</text>
  <path d="M 330 859 h 30 l 24 -12" stroke="#1A1D21" stroke-width="1.8" fill="none"/>

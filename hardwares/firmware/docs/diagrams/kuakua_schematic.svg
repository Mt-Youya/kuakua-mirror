  <use href="#gnd" x="225" y="888"/>

  <!-- ==================== J1 USB-C (left bottom) ==================== -->
  <rect x="120" y="910" width="350" height="118" fill="#FFFFFF" stroke="#1A1D21" stroke-width="2" rx="6"/>
  <text x="140" y="944" font-size="16" font-weight="700" fill="#1A1D21">J1 · USB Type-C</text>
  <text x="140" y="968" font-size="13" fill="#6B7075">5V 供电 · USB-CDC 串口（烧录 / 调试）</text>
  <text x="140" y="990" font-size="13" fill="#6B7075">ARDUINO_USB_CDC_ON_BOOT</text>
  <g font-size="12.5" font-family="Consolas,'JetBrains Mono',monospace" fill="#1A1D21" text-anchor="end">
    <text x="452" y="944">VBUS</text>
    <text x="452" y="982">D-</text>
    <text x="452" y="1012">D+</text>
  </g>
  <path d="M 470 978 h 250 v -129 h 20" stroke="#1A1D21" stroke-width="1.7" fill="none"/>
  <path d="M 470 1008 h 258 v -118 h 12" stroke="#1A1D21" stroke-width="1.7" fill="none"/>

  <!-- ==================== LCD1 (right) ==================== -->
  <rect x="1520" y="270" width="380" height="240" fill="#FFFFFF" stroke="#1A1D21" stroke-width="2" rx="6"/>
  <text x="1540" y="306" font-size="17" font-weight="700" fill="#1A1D21">LCD1 · 2.8″ IPS 触摸屏 240×320</text>
  <text x="1540" y="330" font-size="13" fill="#6B7075">ILI9341 类驱动 IC · 4 线 SPI @40MHz</text>
  <text x="1540" y="352" font-size="13" fill="#6B7075">LVGL 画布 + PSRAM 帧缓冲直推（抱抱动画）</text>
  <g font-size="12.5" font-family="Consolas,'JetBrains Mono',monospace" fill="#1A1D21">
